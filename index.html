<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0e13" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CID" />
    <title>CID - Collaborative Intelligent Development</title>
    <script>
      // review_prompt.md §7: set data-theme before first paint so switching
      // to light doesn't flash dark first — src/theme/useTheme.ts is the
      // single source of truth for this value afterward; this inline copy
      // exists only because it must run before React (or even the CSS)
      // loads. Defaults to dark (CID's existing behavior) unless the user
      // has explicitly chosen light before.
      (function () {
        var stored = localStorage.getItem("cid-theme");
        document.documentElement.setAttribute("data-theme", stored === "light" ? "light" : "dark");
      })();
    </script>
  </head>
  <body class="bg-background text-foreground antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
