[package]
name = "cid"
version = "0.1.0"
edition = "2021"
description = "CID Desktop App"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2" }
cid-core = { path = "../cid-core" }
tokio = { version = "1.40", features = ["full"] }
anyhow = "1.0"
axum = { version = "0.7", features = ["ws"] }
