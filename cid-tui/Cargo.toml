[package]
name = "cid-tui"
version = "0.1.0"
edition = "2021"
description = "Terminal client for CID Core — Missions, chat, approvals, and diffs from a shell."

[[bin]]
name = "cid-tui"
path = "src/main.rs"

[dependencies]
tokio = { workspace = true, features = ["full"] }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

ratatui = "0.29"
crossterm = "0.28"
reqwest = { version = "0.12", features = ["json"] }
chrono = { version = "0.4", features = ["serde"] }
tokio-tungstenite = "0.26"
futures-util = "0.3"

[dev-dependencies]
tokio-test = "0.4"
axum = "0.7"
